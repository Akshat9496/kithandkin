<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Kith & Kin Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/css/portal.css">
<style>
.messages-wrap{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:400px}
.messages-list{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:.75rem;background:var(--cream)}
.msg-bubble{max-width:70%;padding:.85rem 1.1rem;border-radius:2px;font-size:.84rem;line-height:1.6}
.msg-bubble.from-family{align-self:flex-end;background:var(--deep);color:var(--ivory);border-bottom-right-radius:0}
.msg-bubble.from-admin{align-self:flex-start;background:var(--ivory);color:var(--deep);border:1px solid var(--sand);border-bottom-left-radius:0}
.msg-meta{font-size:.65rem;margin-top:.3rem;opacity:.6}
.msg-compose{padding:1rem 1.5rem;border-top:1px solid var(--sand);background:var(--ivory);display:flex;gap:.75rem;align-items:flex-end}
.msg-compose textarea{flex:1;padding:.75rem 1rem;border:1px solid var(--sand);border-radius:1px;font-family:'Outfit',sans-serif;font-size:.85rem;resize:none;height:56px;background:var(--cream);outline:none;transition:border-color .2s;color:var(--deep)}
.msg-compose textarea:focus{border-color:var(--gold)}
</style>
</head>
<body>

<button class="mobile-menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>

<div class="portal-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="https://kithkin.care">Kith <em>&</em> Kin</a>
      <span class="portal-tag">Family Portal</span>
    </div>
    <ul class="sidebar-nav">
      <li><a href="/portal/dashboard.html"><span class="nav-icon">⌂</span> Dashboard</a></li>
      <li><a href="/portal/reports.html"><span class="nav-icon">📋</span> Visit Reports</a></li>
      <li><a href="/portal/schedule.html"><span class="nav-icon">📅</span> Schedule</a></li>
      <li><a href="/portal/profile.html"><span class="nav-icon">👤</span> Care Profile</a></li>
      <li><a href="/portal/messages.html" class="active"><span class="nav-icon">💬</span> Messages</a></li>
    </ul>
    <div class="sidebar-bottom">
      <div class="sidebar-user"><strong id="userName">Loading…</strong></div>
      <button class="btn btn-outline btn-sm" onclick="signOut()" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>

  <main class="main-content" style="padding-bottom:0">

    <div class="page-header">
      <span class="eyebrow">Family Portal</span>
      <h1>Messages</h1>
      <p style="font-size:.82rem;color:var(--muted);margin-top:.4rem">Direct thread with the Kith & Kin team</p>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="messages-wrap">
        <div class="messages-list" id="messagesList">
          <div style="text-align:center;color:var(--muted);font-size:.8rem;padding:2rem">Loading messages…</div>
        </div>
        <div class="msg-compose">
          <textarea id="msgInput" placeholder="Type your message…" onkeydown="handleKey(event)"></textarea>
          <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/js/supabase.js"></script>
<script src="/portal/js/app.js"></script>
<script>
let clientId = null;
let userId = null;
let pollingInterval = null;

async function init() {
  const auth = await requireAuth(['family']);
  if (!auth) return;
  const { profile } = auth;
  userId = profile.id;
  document.getElementById('userName').textContent = profile.full_name;

  const { data: client } = await db
    .from('clients')
    .select('id')
    .eq('family_user_id', profile.id)
    .eq('status', 'Active')
    .single();

  if (!client) {
    document.getElementById('messagesList').innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.8rem;padding:2rem">No active plan found.</div>';
    return;
  }

  clientId = client.id;
  await loadMessages();
  await markRead();

  // Poll for new messages every 30 seconds
  pollingInterval = setInterval(async () => {
    await loadMessages();
    await markRead();
  }, 30000);
}

async function loadMessages() {
  const { data: messages } = await db
    .from('messages')
    .select('*, profiles(full_name, role)')
    .eq('client_id', clientId)
    .order('created_at', { ascending: true });

  const list = document.getElementById('messagesList');

  if (!messages || !messages.length) {
    list.innerHTML = `
      <div style="text-align:center;padding:3rem;color:var(--muted)">
        <div style="font-size:1.5rem;margin-bottom:.75rem;opacity:.4">💬</div>
        <p style="font-size:.82rem;line-height:1.6">No messages yet. Send us a message and we'll respond as soon as possible.</p>
      </div>`;
    return;
  }

  list.innerHTML = messages.map(m => {
    const isFamily = m.profiles?.role === 'family' || m.sender_id === userId;
    const senderName = isFamily ? 'You' : 'Kith & Kin';
    const time = new Date(m.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    return `
      <div>
        <div class="msg-bubble ${isFamily ? 'from-family' : 'from-admin'}">
          ${m.body}
          <div class="msg-meta">${senderName} · ${time}</div>
        </div>
      </div>`;
  }).join('');

  // Scroll to bottom
  list.scrollTop = list.scrollHeight;
}

async function markRead() {
  if (!clientId) return;
  await db
    .from('messages')
    .update({ read_by_family: true })
    .eq('client_id', clientId)
    .eq('read_by_family', false);
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if (!body || !clientId) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  const { error } = await db.from('messages').insert({
    client_id: clientId,
    sender_id: userId,
    body,
    read_by_admin: false,
    read_by_family: true
  });

  if (error) {
    showToast('Could not send message. Please try again.', 'error');
  } else {
    input.value = '';
    await loadMessages();
  }

  btn.disabled = false;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
document.addEventListener('click', (e) => {
  const s = document.getElementById('sidebar'), b = document.getElementById('menuBtn');
  if (s.classList.contains('open') && !s.contains(e.target) && e.target !== b) s.classList.remove('open');
});

// Clean up polling on page leave
window.addEventListener('beforeunload', () => {
  if (pollingInterval) clearInterval(pollingInterval);
});

init();
</script>
</body>
</html>
