<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Kith & Kin Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--deep:#2C2418;--ivory:#FAF7F2;--cream:#F2EDE4;--sand:#D9CFC0;--gold:#BFA06A;--muted:#7A6E62;--terra:#A0674A}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--deep);color:var(--ivory)}
body{display:flex;align-items:center;justify-content:center;position:relative;min-height:100vh}
body::before{content:'';position:absolute;inset:0;background-image:radial-gradient(ellipse 80% 60% at 20% 50%, rgba(191,160,106,.06) 0%, transparent 60%),radial-gradient(ellipse 60% 80% at 80% 30%, rgba(160,103,74,.04) 0%, transparent 60%)}
.arc{position:absolute;border-radius:50%;border:1px solid rgba(191,160,106,.07);pointer-events:none}
.login-wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:1rem}
.login-card{background:rgba(250,247,242,.04);border:1px solid rgba(191,160,106,.15);backdrop-filter:blur(20px);padding:3rem 2.5rem;border-radius:2px}
.login-logo{text-align:center;margin-bottom:2.5rem}
.login-logo a{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--ivory);text-decoration:none;letter-spacing:.04em}
.login-logo a em{font-style:italic;color:var(--gold)}
.login-logo .portal-tag{display:block;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:.4rem}
.login-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;color:var(--ivory);margin-bottom:.4rem;text-align:center}
.login-sub{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:2rem;line-height:1.5;font-weight:300}
.form-group{margin-bottom:1.1rem}
.form-group label{display:block;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.form-group input{width:100%;padding:.8rem 1rem;background:rgba(250,247,242,.06);border:1px solid rgba(217,207,192,.2);color:var(--ivory);font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:300;border-radius:1px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:rgba(191,160,106,.6)}
.form-group input::placeholder{color:rgba(122,110,98,.6)}
.btn-login{width:100%;padding:.9rem;background:var(--gold);color:var(--deep);border:none;font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s;margin-top:.5rem}
.btn-login:hover{background:var(--ivory)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.forgot-link{display:block;text-align:center;margin-top:1rem;font-size:.72rem;color:var(--muted);cursor:pointer;background:none;border:none;width:100%;font-family:'Outfit',sans-serif}
.forgot-link:hover{color:var(--gold)}
.login-footer{text-align:center;margin-top:2rem;font-size:.72rem;color:var(--muted);line-height:1.6}
.login-footer a{color:var(--gold);text-decoration:none}
.error-msg{color:#E74C3C;font-size:.75rem;margin-top:.75rem;text-align:center;display:none}
.success-msg{color:#27AE60;font-size:.75rem;margin-top:.75rem;text-align:center;display:none}
.help-text{text-align:center;margin-top:1rem;font-size:.72rem;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="arc" style="width:600px;height:600px;top:-200px;left:-200px;opacity:.5"></div>
<div class="arc" style="width:400px;height:400px;bottom:-100px;right:-100px;opacity:.3"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <a href="https://kithkin.care">Kith <em>&</em> Kin</a>
      <span class="portal-tag">Family Portal</span>
    </div>

    <!-- Sign in view -->
    <div id="signInView">
      <h2 class="login-title">Welcome back</h2>
      <p class="login-sub">Sign in with the email and password provided by Kith & Kin.</p>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-login" id="signInBtn" onclick="signInWithPassword()">Sign In</button>
      <p class="error-msg" id="errorMsg"></p>
      <button class="forgot-link" onclick="showForgot()">Forgot your password?</button>
    </div>

    <!-- Forgot password view -->
    <div id="forgotView" style="display:none">
      <h2 class="login-title">Reset Password</h2>
      <p class="login-sub">Enter your email and we'll send you a reset link.</p>
      <div class="form-group">
        <label for="resetEmail">Email address</label>
        <input type="email" id="resetEmail" placeholder="your@email.com">
      </div>
      <button class="btn-login" id="resetBtn" onclick="sendReset()">Send Reset Link</button>
      <p class="error-msg" id="resetError"></p>
      <p class="success-msg" id="resetSuccess"></p>
      <button class="forgot-link" onclick="showSignIn()">← Back to sign in</button>
    </div>

    <div class="login-footer">
      <a href="https://kithkin.care">← Back to kithkin.care</a><br>
      <span style="margin-top:.5rem;display:block">Need help? <a href="https://wa.me/919990011246">WhatsApp us</a></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/js/supabase.js"></script>
<script>
// If already logged in, redirect
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) await redirectByEmail(session.user.email);
})();

async function redirectByEmail(email) {
  const { data: profile } = await db
    .from('profiles').select('role').eq('email', email).single();
  if (profile) redirectByRole(profile.role);
}

function redirectByRole(role) {
  if (role === 'admin') window.location.href = '/portal/admin.html';
  else if (role === 'associate') window.location.href = '/portal/associate.html';
  else window.location.href = '/portal/dashboard.html';
}

function showForgot() {
  document.getElementById('signInView').style.display = 'none';
  document.getElementById('forgotView').style.display = 'block';
  document.getElementById('resetEmail').value = document.getElementById('email').value;
}

function showSignIn() {
  document.getElementById('forgotView').style.display = 'none';
  document.getElementById('signInView').style.display = 'block';
}

async function signInWithPassword() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  if (!email || !password) { errEl.textContent = 'Please enter your email and password.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('signInBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = 'Incorrect email or password. Please check and try again.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign In';
    return;
  }

  await redirectByEmail(data.user.email);
}

async function sendReset() {
  const email = document.getElementById('resetEmail').value.trim();
  const errEl = document.getElementById('resetError');
  const sucEl = document.getElementById('resetSuccess');
  errEl.style.display = 'none'; sucEl.style.display = 'none';

  if (!email) { errEl.textContent = 'Please enter your email.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Sending…';

  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://kithkin.care/portal/reset-password.html'
  });

  if (error) {
    errEl.textContent = 'Could not send reset email. Please contact hello@kithkin.care';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Send Reset Link';
    return;
  }

  sucEl.textContent = 'Reset link sent! Check your email inbox.';
  sucEl.style.display = 'block';
  btn.textContent = 'Sent';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (document.getElementById('forgotView').style.display !== 'none') sendReset();
    else signInWithPassword();
  }
});
</script>
</body>
</html>
