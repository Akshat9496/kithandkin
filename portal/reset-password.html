<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Kith & Kin Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--deep:#2C2418;--ivory:#FAF7F2;--gold:#BFA06A;--muted:#7A6E62;--sand:#D9CFC0}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--deep);color:var(--ivory)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.wrap{width:100%;max-width:400px;padding:1rem}
.card{background:rgba(250,247,242,.04);border:1px solid rgba(191,160,106,.15);padding:3rem 2.5rem;border-radius:2px}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;color:var(--ivory);text-decoration:none;display:block;text-align:center;margin-bottom:2rem;letter-spacing:.04em}
.logo em{font-style:italic;color:var(--gold)}
h2{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;text-align:center;margin-bottom:.4rem}
p{font-size:.78rem;color:var(--muted);text-align:center;margin-bottom:2rem;line-height:1.5}
.form-group{margin-bottom:1rem}
label{display:block;font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
input{width:100%;padding:.8rem 1rem;background:rgba(250,247,242,.06);border:1px solid rgba(217,207,192,.2);color:var(--ivory);font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:300;border-radius:1px;outline:none;transition:border-color .2s}
input:focus{border-color:rgba(191,160,106,.6)}
.btn{width:100%;padding:.9rem;background:var(--gold);color:var(--deep);border:none;font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:1px;margin-top:.5rem}
.btn:hover{background:var(--ivory)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{font-size:.75rem;text-align:center;margin-top:.75rem;display:none}
.err{color:#E74C3C}
.suc{color:#27AE60}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <a href="https://kithkin.care" class="logo">Kith <em>&</em> Kin</a>
    <h2>Set New Password</h2>
    <p>Enter your new password below.</p>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPass" placeholder="Min 8 characters">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPass" placeholder="Repeat password">
    </div>
    <button class="btn" id="resetBtn" onclick="doReset()">Update Password</button>
    <p class="msg err" id="errMsg"></p>
    <p class="msg suc" id="sucMsg"></p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/js/supabase.js"></script>
<script>
async function doReset() {
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('confirmPass').value;
  const err = document.getElementById('errMsg');
  const suc = document.getElementById('sucMsg');
  err.style.display = 'none'; suc.style.display = 'none';

  if (p1.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
  if (p1 !== p2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true; btn.textContent = 'Updating…';

  const { error } = await db.auth.updateUser({ password: p1 });

  if (error) {
    err.textContent = 'Could not update password. Please request a new reset link.';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Update Password';
    return;
  }

  suc.textContent = 'Password updated! Redirecting to portal…';
  suc.style.display = 'block';
  setTimeout(() => window.location.href = '/portal/index.html', 2000);
}
</script>
</body>
</html>
