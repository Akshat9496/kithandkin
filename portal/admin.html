<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>

<div class="portal-layout">

      <li><a href="#" onclick="showTab('addClient')" id="tab-addClient"><span class="nav-icon">＋</span> Add Client</a></li>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/js/supabase.js"></script>
<script src="/portal/js/app.js"></script>
<script>
let currentTab = 'overview';
let allClients = [];
let allReportsList = [];

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const auth = await requireAuth(['admin']);
  if (!auth) return;
  document.getElementById('adminName').textContent = auth.profile.full_name;
  await loadClients();
  await checkUnread();
  showTab('overview');
}

// ── Tab router ────────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  const el = document.getElementById(`tab-${tab}`);
  if (el) el.classList.add('active');

  const renders = {
    overview: renderOverview,
    clients: renderClients,
    addClient: renderAddClient,
    addReport: renderAddReport,
    allReports: renderAllReports,
    schedule: renderSchedule,
    messages: renderMessages
  };
  if (renders[tab]) renders[tab]();
  return false;
}

// ── Load shared data ──────────────────────────────────────────────────────────
async function loadClients() {
  const { data } = await db
    .from('clients')
    .select('*, elders(*), profiles(full_name, email)')
    .order('created_at', { ascending: false });
  allClients = data || [];
}

async function checkUnread() {
  const { count } = await db
    .from('messages')
    .select('*', { count: 'exact', head: true })
    .eq('read_by_admin', false);
  if (count > 0) {
    const b = document.getElementById('adminUnreadBadge');
    b.textContent = count; b.style.display = 'inline';
  }
}

// ── OVERVIEW ─────────────────────────────────────────────────────────────────
async function renderOverview() {
  const active = allClients.filter(c => c.status === 'Active');
  const { data: recentReports } = await db
    .from('visit_reports')
    .select('*, elders(full_name), clients(plan)')
    .order('created_at', { ascending: false })
    .limit(5);

  const { data: upcomingVisits } = await db
    .from('visit_schedule')
    .select('*, elders(full_name)')
    .eq('status', 'Scheduled')
    .gte('scheduled_date', new Date().toISOString().split('T')[0])
    .order('scheduled_date', { ascending: true })
    .limit(5);

  const { count: unread } = await db
    .from('messages')
    .select('*', { count: 'exact', head: true })
    .eq('read_by_admin', false);

  setContent(`
    <div class="page-header">
      <span class="eyebrow">Admin Panel</span>
      <h1>Overview</h1>
    </div>

    <div class="grid-4" style="margin-bottom:1.5rem">
      <div class="stat-card">
        <div class="stat-label">Active Clients</div>
        <div class="stat-value">${active.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Clients</div>
        <div class="stat-value">${allClients.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Upcoming Visits</div>
        <div class="stat-value">${upcomingVisits?.length || 0}</div>
      </div>
      <div class="stat-card" style="cursor:pointer" onclick="showTab('messages')">
        <div class="stat-label">Unread Messages</div>
        <div class="stat-value" style="color:${unread > 0 ? 'var(--terra)' : 'var(--deep)'}">${unread || 0}</div>
      </div>
    </div>

    <div class="grid-2" style="align-items:start">
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
          <div class="card-title" style="margin:0">Recent Reports</div>
          <button class="btn btn-outline btn-sm" onclick="showTab('addReport')">+ Add Report</button>
        </div>
        ${recentReports?.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Elder</th><th>Date</th><th>Mood</th></tr></thead>
            <tbody>
              ${recentReports.map(r => `
                <tr>
                  <td>${r.elders?.full_name || '—'}</td>
                  <td>${formatDateShort(r.visit_date)}</td>
                  <td><span class="score-badge"><span class="score-dot" style="background:${scoreColor(r.mood_score)}"></span>${r.mood_score ? scoreLabel(r.mood_score) : '—'}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : '<p style="font-size:.82rem;color:var(--muted)">No reports yet.</p>'}
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:1rem">
          <div class="card-title" style="margin:0">Upcoming Visits</div>
          <button class="btn btn-outline btn-sm" onclick="showTab('schedule')">Manage</button>
        </div>
        ${upcomingVisits?.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Elder</th><th>Date</th><th>Time</th></tr></thead>
            <tbody>
              ${upcomingVisits.map(v => `
                <tr>
                  <td>${v.elders?.full_name || '—'}</td>
                  <td>${formatDateShort(v.scheduled_date)}</td>
                  <td>${v.scheduled_time ? v.scheduled_time.slice(0,5) : '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>` : '<p style="font-size:.82rem;color:var(--muted)">No upcoming visits scheduled.</p>'}
      </div>
    </div>
  `);
}

// ── CLIENTS LIST ──────────────────────────────────────────────────────────────
function renderClients() {
  setContent(`
    <div class="page-header">
      <span class="eyebrow">Admin Panel</span>
      <h1>All Clients</h1>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
        <button class="btn btn-primary btn-sm" onclick="showTab('addClient')">+ Add New Client</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Elder</th><th>Family Contact</th><th>Plan</th><th>Status</th><th>Since</th><th></th></tr>
          </thead>
          <tbody>
            ${allClients.length ? allClients.map(c => `
              <tr>
                <td>
                  <div style="font-weight:400">${c.elders?.full_name || '—'}</div>
                  <div style="font-size:.72rem;color:var(--muted)">${c.elders?.area || c.elders?.city || ''}</div>
                </td>
                <td style="font-size:.8rem">${c.profiles?.full_name || '—'}<br><span style="color:var(--muted);font-size:.72rem">${c.profiles?.email || ''}</span></td>
                <td>The ${c.plan}</td>
                <td><span class="badge badge-${c.status.toLowerCase()}">${c.status}</span></td>
                <td style="font-size:.78rem">${formatDateShort(c.plan_start_date)}</td>
                <td><button class="btn btn-outline btn-sm" onclick="viewClient('${c.id}')">View</button></td>
              </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:2rem">No clients yet.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `);
}

function viewClient(id) {
  const c = allClients.find(x => x.id === id);
  if (!c) return;
  const e = c.elders || {};
  alert(`${e.full_name}\n${e.address || ''}\nPlan: The ${c.plan}\nStatus: ${c.status}\nLanguage: ${e.language_preference || '—'}\nMobility: ${e.mobility_level || '—'}`);
}

async function saveClient() {
  const elderName = document.getElementById('elderName').value.trim();
  const famName = document.getElementById('famName').value.trim();
  const famEmail = document.getElementById('famEmail').value.trim();
  const plan = document.getElementById('plan').value;
  const startDate = document.getElementById('startDate').value;

  if (!elderName || !famName || !famEmail || !plan || !startDate) {
    showToast('Please fill in all required fields.', 'error'); return;
  }

  const btn = document.getElementById('saveClientBtn');
  setLoading(btn, true, 'Creating client…');

  try {
    const planVisits = { Essential: 2, Signature: 4, Premiere: 10 };

    // 1. Create elder record
    const { data: elder, error: elderErr } = await db.from('elders').insert({
      full_name: elderName,
      date_of_birth: document.getElementById('elderDob').value || null,
      gender: document.getElementById('elderGender').value || null,
      address: document.getElementById('elderAddress').value || null,
      area: document.getElementById('elderArea').value || null,
      phone: document.getElementById('elderPhone').value || null,
      emergency_contact_name: document.getElementById('ecName').value || null,
      emergency_contact_phone: document.getElementById('ecPhone').value || null,
      medical_notes: document.getElementById('medNotes').value || null,
      language_preference: document.getElementById('lang').value,
      religion: document.getElementById('religion').value || null,
      dietary_requirements: document.getElementById('diet').value || null,
      mobility_level: document.getElementById('mobility').value || null,
      cognitive_status: document.getElementById('cognitive').value || null,
      privacy_sensitivity: document.getElementById('privacy').value
    }).select().single();

    if (elderErr) throw new Error('Could not create elder: ' + elderErr.message);

    // 2. Call Edge Function to create family user with password
    const famPassword = document.getElementById('famPassword').value.trim();
    if (!famPassword || famPassword.length < 8) throw new Error('Password must be at least 8 characters.');

    const { data: { session } } = await db.auth.getSession();
    const fnRes = await fetch(
      'https://ijyqeopkoxfvkgaufuoo.supabase.co/functions/v1/create-family-user',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
          'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqeXFlb3Brb3hmdmtnYXVmdW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5Mjk3NTMsImV4cCI6MjA5NTUwNTc1M30.ys25-6S6L7AtfgC-BpuumVieFDJ4j9grcugcD2udfKM'
        },
        body: JSON.stringify({ email: famEmail, full_name: famName, password: famPassword })
      }
    );

    const fnData = await fnRes.json();
    if (fnData.error) throw new Error('Could not create family login: ' + fnData.error);

    const familyUserId = fnData.user_id;

    // 3. Update profile with correct name and role
    await db.from('profiles')
      .update({ full_name: famName, role: 'family' })
      .eq('id', familyUserId);

    // 4. Create client record
    const { error: clientErr } = await db.from('clients').insert({
      elder_id: elder.id,
      family_user_id: familyUserId,
      plan,
      plan_start_date: startDate,
      visits_per_month: planVisits[plan],
      status: 'Active',
      notes: document.getElementById('clientNotes').value || null
    });

    if (clientErr) throw new Error('Could not create client: ' + clientErr.message);

    showToast(`Client created! Share login: ${famEmail} / ${document.getElementById('famPassword').value.trim()}`);
    await loadClients();
    showTab('clients');

  } catch (err) {
    showToast(err.message, 'error');
    setLoading(btn, false, 'Create Client & Send Login');
  }
}

function scoreInput(id, label) {
  return `
    <div class="form-group" style="margin-bottom:.85rem">
      <label>${label}</label>
      <div style="display:flex;gap:.5rem">
        ${[1,2,3,4,5].map(n => `
          <label style="flex:1;text-align:center;cursor:pointer;padding:.5rem .25rem;border:1px solid var(--sand);border-radius:1px;font-size:.78rem;transition:all .2s" id="${id}_lbl_${n}">
            <input type="radio" name="${id}" value="${n}" style="display:none" onchange="highlightScore('${id}',${n})">
            ${n}
          </label>`).join('')}
      </div>
    </div>`;
}

function highlightScore(id, val) {
  for (let i = 1; i <= 5; i++) {
    const lbl = document.getElementById(`${id}_lbl_${i}`);
    if (lbl) {
      lbl.style.background = i <= val ? scoreColor(val) : '';
      lbl.style.borderColor = i <= val ? scoreColor(val) : 'var(--sand)';
      lbl.style.color = i <= val ? '#fff' : 'var(--deep)';
    }
  }
}

function toggleFollowUp() {
  const checked = document.getElementById('rptFollowUp').checked;
  document.getElementById('followUpGroup').style.display = checked ? 'block' : 'none';
}

async function saveReport() {
  const clientId = document.getElementById('rptClient').value;
  const visitDate = document.getElementById('rptDate').value;
  const summary = document.getElementById('rptSummary').value.trim();

  if (!clientId || !visitDate || !summary) {
    showToast('Client, date, and summary are required.', 'error'); return;
  }

  const client = allClients.find(c => c.id === clientId);
  if (!client) { showToast('Client not found.', 'error'); return; }

  const btn = document.getElementById('saveReportBtn');
  setLoading(btn, true, 'Save Visit Report');

  const getScore = (name) => {
    const el = document.querySelector(`input[name="${name}"]:checked`);
    return el ? parseInt(el.value) : null;
  };

  const { error } = await db.from('visit_reports').insert({
    client_id: clientId,
    elder_id: client.elder_id,
    visit_date: visitDate,
    visit_duration_mins: parseInt(document.getElementById('rptDuration').value) || null,
    blood_pressure_systolic: parseInt(document.getElementById('rptBpSys').value) || null,
    blood_pressure_diastolic: parseInt(document.getElementById('rptBpDia').value) || null,
    pulse_bpm: parseInt(document.getElementById('rptPulse').value) || null,
    spo2_percent: parseInt(document.getElementById('rptSpo2').value) || null,
    temperature_c: parseFloat(document.getElementById('rptTemp').value) || null,
    weight_kg: parseFloat(document.getElementById('rptWeight').value) || null,
    mood_score: getScore('rptMood'),
    mobility_score: getScore('rptMobility'),
    nutrition_score: getScore('rptNutrition'),
    social_score: getScore('rptSocial'),
    hygiene_score: getScore('rptHygiene'),
    summary,
    observations: document.getElementById('rptObs').value || null,
    actions_taken: document.getElementById('rptActions').value || null,
    follow_up_required: document.getElementById('rptFollowUp').checked,
    follow_up_notes: document.getElementById('rptFollowUpNotes').value || null,
    verified_visit: document.getElementById('rptVerified').checked
  });

  if (error) {
    showToast('Error saving report: ' + error.message, 'error');
    setLoading(btn, false, 'Save Visit Report');
    return;
  }

  showToast('Visit report saved successfully.');
  showTab('allReports');
}

// ── ALL REPORTS ───────────────────────────────────────────────────────────────

  const { data: reports } = await db
    .from('visit_reports')
    .select('*, elders(full_name), clients(plan)')

    .limit(50);

  setContent(`

      <span class="eyebrow">Admin Panel</span>
      <h1>All Visit Reports</h1>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Elder</th><th>Date</th><th>Plan</th><th>Mood</th><th>BP</th><th>Follow-up</th><th>Summary</th></tr>
          </thead>
          <tbody>
            ${allReportsList.length ? allReportsList.map(r => `
              <tr>

                <td style="font-size:.75rem">The ${r.clients?.plan || '—'}</td>
                <td><span class="score-badge"><span class="score-dot" style="background:${scoreColor(r.mood_score)}"></span>${r.mood_score ? scoreLabel(r.mood_score) : '—'}</span></td>
                <td style="font-size:.78rem">${bpDisplay(r.blood_pressure_systolic, r.blood_pressure_diastolic)}</td>

// ── SCHEDULE ──────────────────────────────────────────────────────────────────
async function renderSchedule() {
  const activeClients = allClients.filter(c => c.status === 'Active');

  const { data: upcoming } = await db
    .from('visit_schedule')
    .select('*, elders(full_name)')
    .gte('scheduled_date', new Date().toISOString().split('T')[0])
    .order('scheduled_date', { ascending: true })
    .limit(20);

  setContent(`
    <div class="page-header">
      <span class="eyebrow">Admin Panel</span>
      <h1>Manage Schedule</h1>
    </div>

    <div class="grid-2" style="align-items:start">

      <div class="card" style="margin-bottom:1rem">
        <div class="card-title">Schedule a Visit</div>
        <div class="form-group"><label>Client *</label>
          <select id="schClient">
            <option value="">Select client</option>
            ${activeClients.map(c => `<option value="${c.id}" data-elder="${c.elder_id}">${c.elders?.full_name || '—'}</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Date *</label><input id="schDate" type="date"></div>
          <div class="form-group"><label>Time</label><input id="schTime" type="time"></div>
        </div>
        <div class="form-group"><label>Notes</label><input id="schNotes" type="text" placeholder="Any notes for this visit"></div>
        <button class="btn btn-primary" onclick="saveSchedule()" id="saveSchBtn" style="width:100%;justify-content:center">Schedule Visit</button>
      </div>

      <div class="card">
        <div class="card-title">Upcoming Visits</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Elder</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead>
            <tbody id="scheduleBody">
              ${upcoming?.length ? upcoming.map(v => `
                <tr>
                  <td>${v.elders?.full_name || '—'}</td>
                  <td>${formatDateShort(v.scheduled_date)}</td>
                  <td>${v.scheduled_time ? v.scheduled_time.slice(0,5) : '—'}</td>
                  <td><span class="badge badge-${v.status.toLowerCase()}">${v.status}</span></td>
                  <td><button class="btn btn-outline btn-sm" onclick="cancelVisit('${v.id}')">Cancel</button></td>
                </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:1.5rem;font-size:.82rem">No upcoming visits.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

    </div>
  `);
}

async function saveSchedule() {
  const clientId = document.getElementById('schClient').value;
  const date = document.getElementById('schDate').value;
  if (!clientId || !date) { showToast('Client and date are required.', 'error'); return; }

  const client = allClients.find(c => c.id === clientId);
  const btn = document.getElementById('saveSchBtn');
  setLoading(btn, true, 'Schedule Visit');

  const { error } = await db.from('visit_schedule').insert({
    client_id: clientId,
    elder_id: client.elder_id,
    scheduled_date: date,
    scheduled_time: document.getElementById('schTime').value || null,
    notes: document.getElementById('schNotes').value || null,
    status: 'Scheduled'
  });

  if (error) {
    showToast('Error: ' + error.message, 'error');
    setLoading(btn, false, 'Schedule Visit');
    return;
  }

  showToast('Visit scheduled.');
  renderSchedule();
}

async function cancelVisit(id) {
  if (!confirm('Mark this visit as cancelled?')) return;
  await db.from('visit_schedule').update({ status: 'Cancelled' }).eq('id', id);
  showToast('Visit cancelled.');
  renderSchedule();
}

// ── MESSAGES ──────────────────────────────────────────────────────────────────
async function renderMessages() {
  const { data: threads } = await db
    .from('clients')
    .select('id, elders(full_name), profiles(full_name)')
    .eq('status', 'Active');

  setContent(`
    <div class="page-header">
      <span class="eyebrow">Admin Panel</span>
      <h1>Messages</h1>
    </div>
    <div class="grid-2" style="align-items:start">
      <div class="card">
        <div class="card-title">Client Threads</div>
        <div id="threadList" style="display:flex;flex-direction:column;gap:.5rem">
          ${threads?.length ? threads.map(t => `
            <button onclick="loadThread('${t.id}','${t.elders?.full_name || 'Client'}')" class="btn btn-outline" style="justify-content:flex-start;text-align:left">
              <span>💬</span> ${t.elders?.full_name || '—'} <span style="color:var(--muted);font-size:.72rem;margin-left:.5rem">(${t.profiles?.full_name || '—'})</span>
            </button>`).join('') : '<p style="font-size:.82rem;color:var(--muted)">No active clients.</p>'}
        </div>
      </div>
      <div class="card" id="threadPane">
        <div class="empty-state"><div class="empty-icon">💬</div><p>Select a client thread to view messages.</p></div>
      </div>
    </div>
  `);

  // Mark all admin unread as read
  await db.from('messages').update({ read_by_admin: true }).eq('read_by_admin', false);
  document.getElementById('adminUnreadBadge').style.display = 'none';
}

let currentThreadClientId = null;
let adminUserId = null;
let threadPolling = null;

async function loadThread(clientId, elderName) {
  currentThreadClientId = clientId;
  const sess = await db.auth.getSession();
  adminUserId = sess.data.session?.user.id;

  await fetchThreadMessages(elderName);

  if (threadPolling) clearInterval(threadPolling);
  threadPolling = setInterval(() => fetchThreadMessages(elderName), 20000);
}

async function fetchThreadMessages(elderName) {
  const { data: messages } = await db
    .from('messages')
    .select('*, profiles(full_name, role)')
    .eq('client_id', currentThreadClientId)
    .order('created_at', { ascending: true });

  const pane = document.getElementById('threadPane');
  if (!pane) { clearInterval(threadPolling); return; }

  const msgsHtml = messages?.length ? messages.map(m => {
    const isAdmin = m.profiles?.role === 'admin';
    const time = new Date(m.created_at).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    return `
      <div style="display:flex;flex-direction:column;align-items:${isAdmin ? 'flex-end' : 'flex-start'};margin-bottom:.6rem">
        <div style="max-width:80%;padding:.75rem 1rem;font-size:.83rem;line-height:1.5;border-radius:2px;
          background:${isAdmin ? 'var(--deep)' : 'var(--cream)'};
          color:${isAdmin ? 'var(--ivory)' : 'var(--deep)'};
          border:${isAdmin ? 'none' : '1px solid var(--sand)'}">${m.body}</div>
        <div style="font-size:.65rem;color:var(--muted);margin-top:.2rem">${isAdmin ? 'You' : m.profiles?.full_name || 'Family'} · ${time}</div>
      </div>`;
  }).join('') : '<div style="text-align:center;color:var(--muted);font-size:.8rem;padding:1.5rem">No messages yet.</div>';

  pane.innerHTML = `
    <div class="card-title">${elderName}</div>
    <div id="adminMsgList" style="height:320px;overflow-y:auto;margin-bottom:1rem;padding:.5rem">${msgsHtml}</div>
    <div style="display:flex;gap:.75rem">
      <textarea id="adminMsgInput" placeholder="Reply to family…" style="flex:1;padding:.7rem;border:1px solid var(--sand);border-radius:1px;font-family:'Outfit',sans-serif;font-size:.83rem;resize:none;height:48px;outline:none;background:var(--cream)" onkeydown="handleAdminKey(event)"></textarea>
      <button class="btn btn-primary" onclick="sendAdminMsg()">Send</button>
    </div>`;

  const msgList = document.getElementById('adminMsgList');
  if (msgList) msgList.scrollTop = msgList.scrollHeight;

  // Mark as read
  await db.from('messages').update({ read_by_admin: true }).eq('client_id', currentThreadClientId).eq('read_by_admin', false);
}

async function sendAdminMsg() {
  const input = document.getElementById('adminMsgInput');
  const body = input.value.trim();
  if (!body || !currentThreadClientId || !adminUserId) return;

  await db.from('messages').insert({
    client_id: currentThreadClientId,
    sender_id: adminUserId,
    body,
    read_by_admin: true,
    read_by_family: false
  });

  input.value = '';
  await fetchThreadMessages(document.querySelector('#threadPane .card-title')?.textContent || '');
}

function handleAdminKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAdminMsg(); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setContent(html) {
  document.getElementById('mainContent').innerHTML = html;
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
document.addEventListener('click', (e) => {
  const s = document.getElementById('sidebar'), b = document.getElementById('menuBtn');
  if (s.classList.contains('open') && !s.contains(e.target) && e.target !== b) s.classList.remove('open');
});

init();
</script>
